<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucas Cruz | Desenvolvedor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
</head>
<body style="overflow: hidden;"> <header id="hero-header">
        <div class="container" style="position: relative; z-index: 2;">
            <p class="subtitle">Desenvolvedor</p>
            <h1>
                <span class="white-glow">Lucas</span> 
                <span class="accent">Cruz</span>
            </h1>
            <p style="color: var(--text-dim); margin: 0 auto 30px; max-width: 600px;">
                Um bom programador sabe que a complexidade deve ficar no código, para que a experiência de quem usa seja sempre <b>leve e natural</b>.
            </p>
            <a href="portifolio.html" class="btn">Descubra Mais</a>
        </div>
        <div class="cursor-glow"></div>
    </header>

    <script>
        const title = document.querySelector('h1');
        const header = document.getElementById('hero-header');

        header.addEventListener('mousemove', (e) => {
            const x = e.clientX;
            const y = e.clientY;
            
            header.style.setProperty('--mouse-x', `${x}px`);
            header.style.setProperty('--mouse-y', `${y}px`);
        });
    </script>
</body>
</html>
